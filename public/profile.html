<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="/logo-keou.png">
<meta name="color-scheme" content="dark">
<title>Profile — Keou Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<style>
.profile-container{max-width:480px}
.settings-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px;margin-bottom:20px;
  transition:border-color .3s var(--ease-out),box-shadow .3s var(--ease-out);
}
.settings-card:hover{border-color:var(--surface-3);box-shadow:var(--shadow-sm)}
.settings-card h3{margin-bottom:20px;font-size:16px}

.account-info{font-size:13px;color:var(--ink-muted);display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.account-info p{margin:0}
.account-info strong{color:var(--ink);font-weight:600}

.role-badge{
  display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;
}
.role-badge.admin{background:rgba(200,240,96,.12);color:#c8f060}
.role-badge.member{background:var(--surface-2);color:var(--ink-muted)}

.change-password-toggle{
  font-size:13px;color:var(--ink-muted);cursor:pointer;margin-top:16px;
  display:flex;align-items:center;gap:6px;transition:color .25s var(--ease-out);
}
.change-password-toggle:hover{color:var(--ink)}
.change-password-toggle #pw-arrow{display:inline-block;transition:transform .3s var(--ease-out)}
.password-section{
  margin-top:16px;padding-top:16px;border-top:1px solid var(--border);
  overflow:hidden;max-height:0;opacity:0;transition:max-height .4s var(--ease-out),opacity .3s var(--ease-out),margin .3s;
  margin-top:0;padding-top:0;border-top:none;
}
.password-section.show{
  max-height:400px;opacity:1;
  margin-top:16px;padding-top:16px;border-top:1px solid var(--border);
}
</style>
</head>
<body>

<div class="ambient-bg"></div>

<nav class="navbar"></nav>

<div class="page-container hidden" id="content">
  <h2 style="margin-bottom:24px">Profile</h2>

  <div class="profile-container stagger-in">
    <!-- Account Info -->
    <div class="settings-card">
      <h3>Account</h3>
      <div class="account-info">
        <p><strong>Name:</strong> <span id="account-name">—</span></p>
        <p><strong>Email:</strong> <span id="account-email">—</span></p>
        <p><strong>Role:</strong> <span id="account-role">—</span></p>
        <p><strong>Member since:</strong> <span id="account-since">—</span></p>
        <p><strong>Last login:</strong> <span id="account-last-login">—</span></p>
      </div>
    </div>

    <!-- Update Name -->
    <div class="settings-card">
      <h3>Update Name</h3>
      <form id="name-form">
        <div class="form-group">
          <label class="form-label" for="profile-name">Display name</label>
          <input class="form-input" id="profile-name" type="text" required>
        </div>
        <button type="submit" class="btn-primary full" id="name-btn">Save</button>
      </form>

      <!-- Change Password -->
      <div class="change-password-toggle" onclick="togglePassword()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Change password <span id="pw-arrow">▸</span>
      </div>
      <div class="password-section" id="password-section">
        <form id="password-form">
          <div class="form-group">
            <label class="form-label">Current password</label>
            <input class="form-input" id="pw-current" type="password" required>
          </div>
          <div class="form-group">
            <label class="form-label">New password</label>
            <input class="form-input" id="pw-new" type="password" minlength="12" required>
            <p class="form-hint">12+ characters, mixed case, number, symbol</p>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm new password</label>
            <input class="form-input" id="pw-confirm" type="password" minlength="12" required>
          </div>
          <button type="submit" class="btn-primary full" id="pw-btn">Update password</button>
        </form>
      </div>
    </div>

  </div>
</div>

<footer class="footer">
  <span class="footer-tagline"><a href="https://studio.kanaky.xyz">Keou Studio</a> &mdash; <a href="https://kanaky.xyz" class="by-kanaky">by kanaky.xyz</a></span>
  <div class="footer-socials">
    <a href="https://www.linkedin.com/company/kanaky-tech/" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>
    <a href="https://github.com/kanakytech" aria-label="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></a>
  </div>
</footer>

<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script src="/shared/i18n-fr.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/auth.js"></script>
<script src="/shared/nav.js"></script>
<script src="/shared/toast.js"></script>
<script>
(async () => {
  const ok = await Auth.guard();
  if (!ok) return;

  Nav.render({ active: 'profile' });
  const contentEl = document.getElementById('content');
  contentEl.classList.remove('hidden');
  requestAnimationFrame(() => { requestAnimationFrame(() => { contentEl.classList.add('page-enter'); }); });

  // Load profile
  try {
    const res = await Auth.authFetch('/api/profile');
    const profile = await res.json();

    document.getElementById('account-name').textContent = profile.name || '—';
    document.getElementById('account-email').textContent = profile.email || '—';
    document.getElementById('profile-name').value = profile.name || '';

    const roleBadge = profile.role === 'admin'
      ? '<span class="role-badge admin">Admin</span>'
      : '<span class="role-badge member">Member</span>';
    document.getElementById('account-role').innerHTML = roleBadge;

    if (profile.created_at) {
      document.getElementById('account-since').textContent =
        new Date(profile.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    if (profile.last_login_at) {
      document.getElementById('account-last-login').textContent =
        new Date(profile.last_login_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
  } catch (e) {
    console.error('Profile load error:', e);
  }

  // Name form
  document.getElementById('name-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('name-btn');
    btn.classList.add('btn-loading'); btn.disabled = true;

    try {
      const res = await Auth.authFetch('/api/profile', {
        method: 'PUT',
        body: JSON.stringify({ name: document.getElementById('profile-name').value.trim() }),
      });
      const data = await res.json();
      if (data.ok) {
        toast('Name updated');
        document.getElementById('account-name').textContent = document.getElementById('profile-name').value.trim();
      }
      else toast(data.error || 'Failed', true);
    } catch (e) { toast('Failed to save', true); }
    finally { btn.classList.remove('btn-loading'); btn.disabled = false; }
  });

  // Password form
  document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPw = document.getElementById('pw-new').value;
    const confirmPw = document.getElementById('pw-confirm').value;

    if (newPw !== confirmPw) { toast('Passwords do not match', true); return; }

    const btn = document.getElementById('pw-btn');
    btn.classList.add('btn-loading'); btn.disabled = true;

    try {
      const res = await Auth.authFetch('/api/auth/change-password', {
        method: 'POST',
        body: JSON.stringify({
          currentPassword: document.getElementById('pw-current').value,
          newPassword: newPw,
        }),
      });
      const data = await res.json();
      if (data.ok) {
        toast('Password updated');
        document.getElementById('password-form').reset();
        togglePassword();
      } else {
        toast(data.error || 'Failed to update password', true);
      }
    } catch (e) { toast('Failed to update password', true); }
    finally { btn.classList.remove('btn-loading'); btn.disabled = false; }
  });
})();

function togglePassword() {
  const section = document.getElementById('password-section');
  const arrow = document.getElementById('pw-arrow');
  section.classList.toggle('show');
  arrow.style.transform = section.classList.contains('show') ? 'rotate(90deg)' : 'rotate(0)';
}


</script>
</body>
</html>
