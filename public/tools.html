<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="/logo-keou.png">
<meta name="color-scheme" content="dark">
<title>Creative Tools — Keou Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<style>
/* ── Tools Page ── */
.tools-header{margin-bottom:28px}
.tools-header h2{margin-bottom:6px}
.tools-header p{color:var(--ink-muted);font-size:14px}

/* ── Tool Cards Grid ── */
.tools-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:28px;
}
.tool-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:20px 14px;text-align:center;
  cursor:pointer;transition:all .25s var(--ease-out);position:relative;
}
.tool-card:hover{
  border-color:var(--border-strong);background:var(--surface-2);
  transform:translateY(-2px);box-shadow:var(--shadow-sm);
}
.tool-card:active{transform:translateY(0) scale(.97);transition-duration:.08s}
.tool-card.active{
  border-color:rgba(255,255,255,.2);background:var(--surface-2);
  box-shadow:var(--shadow-md);
}
.tool-card-icon{
  width:44px;height:44px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;color:var(--ink-muted);transition:all .25s;
}
.tool-card:hover .tool-card-icon,.tool-card.active .tool-card-icon{
  color:var(--ink);background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);
}
.tool-card-icon svg{width:22px;height:22px}
.tool-card-name{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
.tool-card.active .tool-card-name{color:var(--ink)}
.tool-card-desc{font-size:11px;color:var(--ink-faint);line-height:1.4}
.tool-card-cost{
  font-size:10px;color:var(--ink-faint);margin-top:8px;
  padding-top:8px;border-top:1px solid var(--border);
  letter-spacing:.3px;
}

/* ── Workspace ── */
.tool-workspace{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px;margin-bottom:24px;
  animation:fadeInUp .3s var(--ease-out);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.ws-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.ws-header h3{font-size:17px;font-weight:700}
.ws-close{
  width:32px;height:32px;border-radius:8px;border:none;
  background:rgba(255,255,255,.04);color:var(--ink-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;
}
.ws-close:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.ws-close svg{width:16px;height:16px}
.ws-subtitle{font-size:13px;color:var(--ink-muted);margin-bottom:20px}

/* ── TTS Workspace ── */
.tts-text{width:100%;min-height:120px;resize:vertical}
.tts-char-count{
  text-align:right;font-size:11px;color:var(--ink-faint);margin-top:4px;
  font-variant-numeric:tabular-nums;
}
.tts-char-count.warn{color:var(--error)}

/* ── Advanced Settings Toggle ── */
.adv-toggle{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 0;color:var(--ink-muted);font-size:12px;font-weight:500;
  cursor:pointer;transition:color .15s;background:none;border:none;
  font-family:'Space Grotesk',sans-serif;margin-bottom:12px;
}
.adv-toggle:hover{color:var(--ink)}
.adv-toggle svg{width:14px;height:14px;transition:transform .2s}
.adv-toggle.open svg{transform:rotate(180deg)}
.adv-panel{display:none;margin-bottom:20px}
.adv-panel.open{display:block}

/* ── Range Sliders ── */
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.slider-row label{font-size:12px;color:var(--ink-soft);min-width:110px;flex-shrink:0}
.slider-row input[type=range]{
  flex:1;height:4px;-webkit-appearance:none;appearance:none;
  background:rgba(255,255,255,.08);border-radius:4px;outline:none;
}
.slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#e5e5e5;border:2px solid rgba(255,255,255,.15);cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.slider-row .slider-val{
  font-size:12px;color:var(--ink-muted);min-width:36px;text-align:right;
  font-variant-numeric:tabular-nums;
}

/* ── Drop Zone (Image Upload) ── */
.tool-drop{
  border:2px dashed rgba(255,255,255,.12);border-radius:var(--radius);
  padding:40px 24px;text-align:center;cursor:pointer;
  transition:all .3s var(--ease-out);background:rgba(255,255,255,.015);
  margin-bottom:16px;
}
.tool-drop:hover,.tool-drop.dragover{
  border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.03);
}
.tool-drop .drop-icon{
  width:44px;height:44px;border-radius:50%;background:var(--surface-2);
  border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;color:var(--ink-muted);transition:all .25s;
}
.tool-drop:hover .drop-icon{border-color:rgba(255,255,255,.15);color:var(--ink)}
.tool-drop .drop-text{font-size:13px;color:var(--ink-muted)}
.tool-drop .drop-text span{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.tool-drop.has-file{padding:16px;border-style:solid;border-color:var(--border-strong)}
.tool-drop.has-file .preview-img{
  max-height:200px;max-width:100%;border-radius:var(--radius-sm);
  object-fit:contain;margin:0 auto;display:block;
}
.tool-drop.has-file{cursor:pointer}

/* ── Factor Selector ── */
.factor-grid{display:flex;gap:8px;margin-bottom:20px}
.factor-btn{
  flex:1;padding:14px 8px;border:1.5px solid var(--border);
  border-radius:var(--radius-sm);background:transparent;
  color:var(--ink-muted);font-family:'Space Grotesk',sans-serif;
  font-size:14px;font-weight:600;cursor:pointer;
  transition:all .2s var(--ease-out);text-align:center;
}
.factor-btn:hover{border-color:rgba(255,255,255,.15);color:var(--ink);transform:translateY(-1px)}
.factor-btn:active{transform:scale(.96);transition-duration:.08s}
.factor-btn.active{
  border-color:rgba(255,255,255,.2);color:var(--ink);
  background:rgba(255,255,255,.06);
}
.factor-label{display:block;font-size:20px;font-weight:700;margin-bottom:2px}
.factor-sub{display:block;font-size:10px;color:var(--ink-faint);font-weight:400}

/* ── Options Row ── */
.options-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.options-row .form-group{flex:1;min-width:140px;margin-bottom:0}

/* ── Processing State ── */
.tool-processing{
  display:flex;flex-direction:column;align-items:center;
  gap:16px;padding:48px 24px;
}
.tool-processing .spinner{width:28px;height:28px;border-width:3px}
.tool-processing p{color:var(--ink-muted);font-size:14px}

/* ── Result ── */
.tool-result{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;
  animation:fadeInUp .3s var(--ease-out);
}
.tool-result .section-label{margin-bottom:12px}
.tool-result audio{width:100%;margin:12px 0 16px;border-radius:8px}
.tool-result img,.tool-result video{
  max-width:100%;max-height:400px;border-radius:var(--radius-sm);
  margin:12px auto 16px;display:block;
}
.tool-result .result-actions{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}

/* ── Hint ── */
.tool-hint{
  display:flex;align-items:flex-start;gap:8px;
  padding:12px 16px;border-radius:var(--radius-xs);
  background:rgba(129,140,248,.08);border:1px solid rgba(129,140,248,.15);
  font-size:12px;color:var(--ink-soft);line-height:1.5;
  margin-bottom:20px;
}
.tool-hint svg{flex-shrink:0;margin-top:1px;color:var(--accent)}

/* ── Video Generator Model Chips ── */
.vg-model-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.vg-model-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--ink-muted);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif;
}
.vg-model-chip:hover{border-color:var(--border-strong);color:var(--ink-soft)}
.vg-model-chip.active{
  border-color:rgba(255,255,255,.25);color:var(--ink);background:rgba(255,255,255,.04);
  font-weight:600;
}
.vg-model-chip svg{width:14px;height:14px;flex-shrink:0}
.vg-model-cost{font-size:10px;color:var(--ink-faint);margin-left:2px}
.vg-model-options{
  background:rgba(255,255,255,.02);border:1px solid var(--border);
  border-radius:var(--radius-xs);padding:16px;margin-bottom:16px;
  animation:fadeInUp .2s var(--ease-out);
}
.vg-model-options .options-row{margin-bottom:0}
.vg-cost-bar{
  text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);
  padding:10px 16px;margin-bottom:14px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:var(--radius-xs);font-variant-numeric:tabular-nums;
  transition:all .2s;
}
.vg-cd-wrap{margin-bottom:16px}
.vg-cd-wrap textarea{width:100%;min-height:60px;resize:vertical}
.vg-cd-wrap .form-label{margin-bottom:6px}

/* ── Responsive ── */
@media(max-width:960px){
  .tools-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .tools-grid{grid-template-columns:repeat(3,1fr)}
  .tool-workspace{padding:20px}
  .slider-row{flex-direction:column;align-items:flex-start;gap:6px}
  .slider-row input[type=range]{width:100%}
  .vg-model-chips{gap:6px}
  .vg-model-chip{padding:6px 10px;font-size:11px}
}
@media(max-width:640px){
  .tools-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
  .tools-grid{grid-template-columns:repeat(2,1fr)}
  .options-row{flex-direction:column}
  .factor-grid{flex-wrap:wrap}
  .vg-model-chip .vg-model-cost{display:none}
}

</style>
</head>

<script>
(async () => {
  // Community edition : « Launch Keou » doit ouvrir les OUTILS autant que le
  // studio. La voix, le bruitage et le générateur de vidéo n'existent que sur
  // cette page — studio.html n'a pas une ligne de tts ni de sfx. Tant qu'elle
  // n'appelait que Auth.guard(), un visiteur sans compte était renvoyé au login
  // et ne les voyait jamais.
  // L'amorçage est copié de studio.html à l'identique, sciemment : deux
  // amorçages différents divergeraient au premier changement.
  let anon = false;
  const hasSession = await Auth.init();
  if (!hasSession && window.AnonMode) anon = await AnonMode.tryInstall();
  if (!anon) {
    const ok = await Auth.guard();
    if (!ok) return;
  }
  window.IS_ANON = anon;
  if (anon) document.body.classList.add('keou-anon');

  if (anon) AnonMode.renderNav();
  else Nav.render({ active: 'tools' });

  if (anon) {
    // La clé du visiteur ne vit que dans son navigateur. Sans cette barre, qui
    // arrive directement sur /tools.html n'a nulle part où la coller et chaque
    // bouton répond « API key required » sans dire où poser la clé.
    AnonMode.renderByokBar(document.getElementById('app'));
    // Le sous-titre « pour votre équipe » parle à une agence connectée. Le
    // visiteur anonyme a besoin de la règle, pas du slogan.
    const sub = document.querySelector('.tools-header p');
    if (sub) sub.textContent = "No account needed. Everything you create here is public in the community gallery. Prices below are the provider's, billed straight to your own API key — Keou takes nothing.";
  }
  document.getElementById('app').style.display = '';

  // ─── State ───
  let currentTool = null;
  let pollingTimer = null;
  let uploadedUrl = null;

  // La file anonyme publie le texte de la voix dans la galerie et le borne donc
  // à l'extrait qu'elle y affiche (MAX_TTS_CHARS = 500 dans src/routes/essai.js).
  // Annoncer 5 000 caractères laissait le visiteur écrire une page entière pour
  // se faire refuser au clic, sans jamais savoir pourquoi.
  const ttsMax = anon ? 500 : 5000;

  // ─── DOM ───
  const toolsGrid = document.getElementById('tools-grid');
  const workspace = document.getElementById('workspace');
  const resultArea = document.getElementById('result-area');

  // ─── Voices (grouped) ───

    { label: 'Professional', voices: [
      { id:'jsCqWAovK2LkecY7zXl4', name:'Freya' },

      { id:'g5CIjZEefAph4nQFvHAz', name:'Ethan' },
      { id:'jBpfuIE2acCO8z3wKNLl', name:'Gigi' },
      { id:'oWAxZDx7w5VEj9dCyTzz', name:'Grace (Pro)' },
      { id:'pqHfZKP75CvOlQylNhV4', name:'Harry' },
      { id:'SOYHLrjzK2X1ezoPC6cr', name:'James' },
      { id:'XB0fDUnXU5powFXDhCwa', name:'Charlotte (Pro)' },

  // ─── Drop Zone Setup ───
  function setupDropZone(dropId, fileId) {
    setTimeout(() => {
      const drop = document.getElementById(dropId);
      const input = document.getElementById(fileId);
      if (!drop || !input) return;

      input.addEventListener('change', (e) => {
        if (e.target.files[0]) handleFile(e.target.files[0], dropId);
      });

      drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
      drop.addEventListener('drop', (e) => {
        e.preventDefault();
        drop.classList.remove('dragover');
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0], dropId);
      });
    }, 50);
  }

  async function handleFile(file, dropId) {
    if (!file.type.startsWith('image/')) {
      toast('Please select an image file', true);
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      toast('File too large (max 20 MB)', true);
      return;
    }

    const drop = document.getElementById(dropId);

    // Show preview
    const reader = new FileReader();
    reader.onload = (e) => {
      drop.classList.add('has-file');
      drop.innerHTML = `<img class="preview-img" src="${e.target.result}" alt="Preview">`;
      drop.onclick = () => {
        const inp = drop.parentElement.querySelector('input[type=file]');
        if (inp) inp.click();
      };
    };
    reader.readAsDataURL(file);

    // Upload to R2
    toast('Uploading image...');
    try {
      const form = new FormData();
      form.append('image', file);
      const res = await Auth.authFetch('/api/upload', { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      uploadedUrl = data.url;
      toast('Image uploaded');
    } catch (err) {
      toast(err.message || 'Upload failed', true);
      uploadedUrl = null;
      // Reset drop zone
      drop.classList.remove('has-file');
      const tool = currentTool;
      renderWorkspace(tool);
    }
  }

  // ─── Video Drop Zone Setup ───
  function setupVideoDropZone(dropId, fileId) {
    setTimeout(() => {
      const drop = document.getElementById(dropId);
      const input = document.getElementById(fileId);
      if (!drop || !input) return;

      input.addEventListener('change', (e) => {
        if (e.target.files[0]) handleVideoFile(e.target.files[0], dropId);
      });

      drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
      drop.addEventListener('drop', (e) => {
        e.preventDefault();
        drop.classList.remove('dragover');
        if (e.dataTransfer.files[0]) handleVideoFile(e.dataTransfer.files[0], dropId);
      });
    }, 50);
  }

  async function handleVideoFile(file, dropId) {
    const allowedTypes = ['video/mp4', 'video/quicktime', 'video/x-matroska'];
    if (!allowedTypes.includes(file.type) && !file.name.match(/\.(mp4|mov|mkv)$/i)) {
      toast('Unsupported format. Use MP4, MOV or MKV.', true);
      return;
    }
    if (file.size > 50 * 1024 * 1024) {
      toast('File too large (max 50 MB)', true);
      return;
    }

    const drop = document.getElementById(dropId);
    const sizeMB = (file.size / 1024 / 1024).toFixed(1);

    // Show file info (no video preview to save memory)
    drop.classList.add('has-file');
    drop.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;justify-content:center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink-muted);flex-shrink:0">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
          <polygon points="10 8 16 12 10 16 10 8"/>
        </svg>
        <div style="text-align:left">
          <div style="font-size:13px;font-weight:600;color:var(--ink);word-break:break-all">${escapeHtml(file.name)}</div>
          <div style="font-size:11px;color:var(--ink-faint);margin-top:2px">${sizeMB} MB</div>
        </div>
      </div>`;
    drop.onclick = () => {
      const inp = drop.parentElement.querySelector('input[type=file]');
      if (inp) inp.click();
    };

    // Upload to R2
    toast('Uploading video...');
    try {
      const form = new FormData();
      form.append('video', file);
      const res = await Auth.authFetch('/api/upload/video', { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      uploadedUrl = data.url;
      toast('Video uploaded');
    } catch (err) {
      toast(err.message || 'Upload failed', true);
      uploadedUrl = null;
      drop.classList.remove('has-file');
      renderWorkspace(currentTool);
    }
  }

  // ─── TTS Helpers ───
  window.toggleAdvanced = function() {
    const btn = document.getElementById('adv-toggle');
    const panel = document.getElementById('adv-panel');
    if (!btn || !panel) return;
    btn.classList.toggle('open');
    panel.classList.toggle('open');
  };

  window.updateSliderVal = function(input) {
    const span = input.parentElement.querySelector('.slider-val');
    if (span) span.textContent = parseFloat(input.value).toFixed(2);
  };

  // ─── Factor Picker ───
  window.pickFactor = function(prefix, btn) {
    const grid = btn.closest('.factor-grid');
    grid.querySelectorAll('.factor-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };

  function getSelectedFactor(gridId) {
    const active = document.querySelector(`#${gridId} .factor-btn.active`);
    return active ? active.dataset.factor : '4';

  // ─── Submit Functions ───

  async function submitTts() {
    const btn = document.getElementById('btn-tts');
    const text = document.getElementById('tts-text').value.trim();
    if (!text) { toast('Please enter some text'); return; }
    // Le gabarit rend mot pour mot la phrase déjà traduite pour 5 000 : seule la
    // borne anonyme (500) est une clé neuve à ajouter au dictionnaire.
    if (text.length > ttsMax) { toast(`Text exceeds ${ttsMax.toLocaleString('en-US')} character limit`); return; }

    const voice = document.getElementById('tts-voice').value;
    // Le moteur choisi part avec la requête ; le serveur le valide contre sa
    // propre liste, l'interface ne fait que proposer.
    const moteur = document.getElementById('tts-engine');

    const body = { text, voice };
    if (moteur && moteur.value) body.voiceModel = moteur.value;

    // Advanced settings (only if panel is open)
    const panel = document.getElementById('adv-panel');
    if (panel && panel.classList.contains('open')) {
      body.stability = parseFloat(document.getElementById('tts-stability').value);
      body.similarity_boost = parseFloat(document.getElementById('tts-similarity').value);
      body.style = parseFloat(document.getElementById('tts-style').value);
      body.speed = parseFloat(document.getElementById('tts-speed').value);
    }

    await runTool(btn, '/api/tools/tts', body, 'tts');
  }
  window.submitTts = submitTts;

  // ─── SFX Helpers ───
  window.toggleSfxAdvanced = function() {
    const btn = document.getElementById('sfx-adv-toggle');
    const panel = document.getElementById('sfx-adv-panel');
    if (!btn || !panel) return;
    btn.classList.toggle('open');
    panel.classList.toggle('open');
  };

  async function submitSfx() {
    const btn = document.getElementById('btn-sfx');
    const text = document.getElementById('sfx-text').value.trim();
    if (!text) { toast('Please describe the sound effect'); return; }
    if (text.length > 450) { toast('Text exceeds 450 character limit'); return; }

    const duration = document.getElementById('sfx-duration').value;

    const body = { text };
    if (duration) body.duration_seconds = parseFloat(duration);

    // Le sélecteur de format et le panneau avancé n'existent pas en anonyme
    // (la file anonyme ne les lit pas) : on lit donc l'élément avant de s'en
    // servir, sinon la génération plantait sur un `null.value`.
    const fmt = document.getElementById('sfx-format');
    if (fmt) body.output_format = fmt.value;

    // Advanced settings
    const panel = document.getElementById('sfx-adv-panel');
    if (panel && panel.classList.contains('open')) {
      body.prompt_influence = parseFloat(document.getElementById('sfx-influence').value);
      const loopBtn = document.getElementById('sfx-loop-btn');
      body.loop = loopBtn && loopBtn.classList.contains('active');
    }

    await runTool(btn, '/api/tools/sfx', body, 'sfx');
  }
  window.submitSfx = submitSfx;

  async function submitImageUpscale() {
    const btn = document.getElementById('btn-img-up');
    if (!uploadedUrl) { toast('Please upload an image first'); return; }
    const factor = getSelectedFactor('img-factor-grid');

    await runTool(btn, '/api/tools/image-upscale', { imageUrl: uploadedUrl, upscaleFactor: factor }, 'img-upscale');
  }
  window.submitImageUpscale = submitImageUpscale;

  async function submitVideoUpscale() {
    const btn = document.getElementById('btn-vid-up');
    if (!uploadedUrl) { toast('Please upload a video first'); return; }

    const factor = getSelectedFactor('vid-factor-grid');

    await runTool(btn, '/api/tools/video-upscale', { videoUrl: uploadedUrl, upscaleFactor: factor }, 'vid-upscale');
  }
  window.submitVideoUpscale = submitVideoUpscale;

  // ─── Generic Tool Runner ───
  async function runTool(btn, endpoint, body, type) {
    btn.classList.add('btn-loading');
    btn.disabled = true;

    try {
      const res = await Auth.authFetch(endpoint, {
        method: 'POST',
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');

      // Show processing state
      showProcessing();
      toast('Processing...');

      // Start polling
      startPolling(type, data.taskId, data.generationId);
    } catch (err) {
      toast(err.message || 'Something went wrong', true);
      btn.classList.remove('btn-loading');
      btn.disabled = false;
    }
  }

  function showProcessing() {
    workspace.innerHTML = `
      <div class="tool-workspace">
        <div class="tool-processing">
          <div class="spinner"></div>
          <p id="processing-text">Processing your request...</p>
          <button class="btn-ghost" onclick="cancelProcessing()">Cancel</button>
        </div>
      </div>`;
  }

  window.cancelProcessing = function() {
    if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
    renderWorkspace(currentTool);
    toast('Cancelled');
  };

  // ─── Polling ───
  /* L'attente doit DIRE ce qui se passe, et finir par s'arrêter.
   *
   * Trois défauts corrigés ici, tous constatés en production :
   *  - aucun délai maximal : un travail perdu faisait tourner le compteur
   *    indéfiniment, et l'écran restait bloqué sur « Processing… » sans que
   *    rien n'arrive jamais. On s'arrête au bout de six minutes de TRAVAIL.
   *  - le rang en file n'était jamais montré : quand la file anonyme est
   *    chargée, le visiteur regarde un compteur monter en croyant que c'est
   *    cassé, alors que son travail attend simplement son tour.
   *  - le compteur incluait l'attente en file, si bien qu'un travail pouvait
   *    « expirer » avant même d'avoir commencé. Le budget s'applique au
   *    travail réel, pas à la place dans la queue — même règle que le studio.
   *  - une erreur réseau n'était que journalisée : après vingt échecs
   *    d'affilée, on le dit au visiteur au lieu de sonder dans le vide. */
  function startPolling(type, taskId, genId) {
    if (pollingTimer) clearInterval(pollingTimer);
    let travail = 0;                 // secondes de traitement réel
    let echecs = 0;                  // erreurs réseau consécutives
    const MAX_TRAVAIL = 360;         // six minutes, comme le studio
    const MAX_ECHECS = 20;

    const stop = () => { clearInterval(pollingTimer); pollingTimer = null; };

    pollingTimer = setInterval(async () => {
      const txt = document.getElementById('processing-text');
      try {
        const res = await Auth.authFetch(`/api/status/${type}/${taskId}?generationId=${genId}`);
        const data = await res.json();
        echecs = 0;

        if (data.failed) {
          stop();
          toast(data.error || I18N.t('Task failed'), true);
          renderWorkspace(currentTool);
          return;
        }

        if (data.ready) {
          stop();
          showResult(type, data.resultUrl);
          toast(I18N.t('Done!'));
          // Re-render workspace (user can submit again)
          renderWorkspace(currentTool);
          return;
        }

        if (data.state === 'queued') {
          if (txt) {
            txt.textContent = data.position
              ? `${I18N.t('Queued — position')} ${data.position}`
              : I18N.t('Queued — waiting for a free slot');
          }
          return;                    // l'attente en file ne consomme pas le budget
        }

        travail += 3;
        if (txt) txt.textContent = `${I18N.t('Processing')}… ${travail}s`;
        if (travail >= MAX_TRAVAIL) {
          stop();
          toast(I18N.t('Still not finished after 6 minutes — it may still appear in the community gallery'), true);
          renderWorkspace(currentTool);
        }
      } catch (err) {
        echecs++;
        console.error('Poll error:', err);
        if (txt && echecs > 2) txt.textContent = I18N.t('Connection lost — retrying…');
        if (echecs >= MAX_ECHECS) {
          stop();
          toast(I18N.t('Connection lost — check your network and try again'), true);
          renderWorkspace(currentTool);
        }
      }
    }, 3000);
  }

  // ─── Show Result ───
  function showResult(type, url) {
    resultArea.style.display = '';

    // /api/download suppose un compte : en anonyme il répond 403 et le bouton
    // « Download » n'affichait qu'une erreur. Ce que le visiteur possède
    // vraiment, c'est sa création publiée dans la galerie — on l'y envoie.
    const resultActions = anon
      ? `<a class="btn-secondary btn-sm" href="/essai.html" target="_blank" rel="noopener">
        ${SVG_INFO} View in the community gallery
      </a>`
      : `<a class="btn-secondary btn-sm" href="#" onclick="downloadResult(event, ${jsArg(url)})">
        ${SVG_DOWNLOAD} Download
      </a>`;

    if (type === 'tts' || type === 'sfx') {
      resultArea.innerHTML = `
        <div class="section-label">Result</div>
        <audio controls src="${url}" style="width:100%;margin:12px 0 16px"></audio>
        <div class="result-actions">${resultActions}</div>`;
    } else if (type === 'vid-upscale' || type === 'video') {
      resultArea.innerHTML = `
        <div class="section-label">Result</div>
        <video controls src="${url}" style="max-width:100%;max-height:400px;border-radius:12px;margin:12px auto 16px;display:block"></video>
        <div class="result-actions">${resultActions}</div>`;
    } else {
      resultArea.innerHTML = `
        <div class="section-label">Result</div>
        <img src="${escapeHtml(url)}" style="max-width:100%;max-height:400px;border-radius:12px;margin:12px auto 16px;display:block" alt="Result">
        <div class="result-actions">${resultActions}</div>`;
    }

    resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ─── Download via proxy ───
  window.downloadResult = async function(e, url) {
    e.preventDefault();
    toast('Preparing download...');
    try {
      const res = await Auth.authFetch(`/api/download?url=${encodeURIComponent(url)}`);
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      const ext = url.split('.').pop()?.split('?')[0] || 'file';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `keou-tool-${Date.now()}.${ext}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
      toast('Downloaded');
    } catch (err) {
      toast(err.message || 'Download failed', true);
    }
  };

  // ─── Video Generator — Cost Estimator ───
  const VG_PRICING = {
    'grok-imagine': { '480p': 1.6, '720p': 3 },           // credits/sec
    'kling-2.6':    { noAudio: { '5': 55, '10': 110 }, withAudio: { '5': 110, '10': 220 } }, // flat credits
    'kling-3.0':    { std: { noAudio: 14, withAudio: 20 }, pro: { noAudio: 18, withAudio: 27 } }, // credits/sec
    'seedance-2':   { '480p': { noInput: 19, withInput: 11.5 }, '720p': { noInput: 41, withInput: 25 } }, // credits/sec
    'veo3':         { veo3: 250, veo3_fast: 60, veo3_lite: 30 }, // flat credits per video
  };
  const CREDITS_TO_USD = 0.005; // $1 = 200 credits approx

  function estimateVgCost() {
    const el = document.getElementById('vg-cost-estimate');
    if (!el) return;
    const val = id => { const e = document.getElementById(id); return e ? e.value : null; };
    const isOn = id => { const e = document.getElementById(id); return e ? e.classList.contains('active') : false; };

    let credits = 0;
    switch (vgSelectedModel) {
      case 'grok-imagine': {
        const res = val('vg-resolution') || '720p';
        const dur = Number(val('vg-duration') || 10);
        credits = VG_PRICING['grok-imagine'][res] * dur;
        break;
      }
      case 'kling-2.6': {
        const dur = val('vg-duration') || '10';
        const audio = isOn('vg-sound');
        credits = audio ? VG_PRICING['kling-2.6'].withAudio[dur] : VG_PRICING['kling-2.6'].noAudio[dur];
        break;
      }
      case 'kling-3.0': {
        const mode = val('vg-mode') || 'pro';
        const dur = Number(val('vg-duration') || 8);
        const audio = isOn('vg-sound');
        const rates = VG_PRICING['kling-3.0'][mode];
        credits = (audio ? rates.withAudio : rates.noAudio) * dur;
        break;
      }
      case 'seedance-2': {
        const res = val('vg-resolution') || '720p';
        const dur = Number(val('vg-duration') || 8);
        credits = VG_PRICING['seedance-2'][res].withInput * dur; // image-to-video = with input
        break;
      }
      case 'veo3': {
        const variant = val('vg-variant') || 'veo3';
        credits = VG_PRICING['veo3'][variant];
        break;
      }
    }

    const usd = (credits * CREDITS_TO_USD).toFixed(2);
    el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;display:inline;vertical-align:-1px;margin-right:4px"><circle cx="12" cy="12" r="10"/><path d="M12 6v12"/><path d="M15.5 9.5a3 3 0 0 0-3-1.5H10a3 3 0 0 0 0 4h4a3 3 0 0 1 0 4h-3.5a3 3 0 0 1-3-1.5"/></svg>${Math.round(credits)} credits · ~$${usd}`;
  }

  let vgSelectedModel = 'grok-imagine';

  window.pickVgModel = function(btn) {
    if (!btn) return;
    document.querySelectorAll('.vg-model-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    vgSelectedModel = btn.dataset.model;
    renderVgOptions(vgSelectedModel);
  };

  function renderVgOptions(model) {
    const wrap = document.getElementById('vg-model-options');
    if (!wrap) return;

    const sel = (id, label, opts) => {
      const options = opts.map(o => `<option value="${o.value}"${o.default ? ' selected' : ''}>${o.label}</option>`).join('');
      return `<div class="form-group"><label class="form-label">${label}</label><select class="form-input" id="${id}">${options}</select></div>`;
    };
    const toggle = (id, label, def = false) =>
      `<div class="form-group"><label class="form-label">${label}</label><button class="factor-btn${def ? ' active' : ''}" id="${id}" style="padding:6px 16px;width:auto" onclick="this.classList.toggle('active');this.textContent=this.classList.contains('active')?'On':'Off'">${def ? 'On' : 'Off'}</button></div>`;

    let html = '<div class="options-row">';

    switch (model) {
      case 'grok-imagine':
        html += sel('vg-mode', 'Mode', [
          { value: 'normal', label: 'Normal', default: true },
          { value: 'fun', label: 'Fun' },
        ]);
        html += sel('vg-duration', 'Duration', [
          { value: '6', label: '6s' },
          { value: '10', label: '10s', default: true },
          { value: '15', label: '15s' },
          { value: '20', label: '20s' },
          { value: '30', label: '30s' },
        ]);
        html += sel('vg-resolution', 'Resolution', [
          { value: '480p', label: '480p (fast)' },
          { value: '720p', label: '720p', default: true },
        ]);
        break;

      case 'kling-2.6':
        html += sel('vg-duration', 'Duration', [
          { value: '5', label: '5 seconds' },
          { value: '10', label: '10 seconds', default: true },
        ]);
        html += toggle('vg-sound', 'Sound');
        break;

      case 'kling-3.0':
        html += sel('vg-mode', 'Mode', [
          { value: 'pro', label: 'Pro (1080p)', default: true },
          { value: 'std', label: 'Standard (720p)' },
        ]);
        html += sel('vg-duration', 'Duration', [
          { value: '5', label: '5s' },
          { value: '8', label: '8s', default: true },
          { value: '10', label: '10s' },
          { value: '15', label: '15s' },
        ]);
        html += sel('vg-aspect', 'Aspect Ratio', [
          { value: '16:9', label: '16:9', default: true },
          { value: '9:16', label: '9:16' },
          { value: '1:1', label: '1:1' },
        ]);
        html += toggle('vg-sound', 'Sound');
        break;

      case 'seedance-2':
        html += sel('vg-resolution', 'Resolution', [
          { value: '480p', label: '480p (fast)' },
          { value: '720p', label: '720p', default: true },
        ]);
        html += sel('vg-duration', 'Duration', [
          { value: '4', label: '4s' },
          { value: '8', label: '8s', default: true },
          { value: '12', label: '12s' },
        ]);
        html += sel('vg-aspect', 'Aspect Ratio', [
          { value: '16:9', label: '16:9', default: true },
          { value: '9:16', label: '9:16' },
          { value: '1:1', label: '1:1' },
          { value: '4:3', label: '4:3' },
          { value: '3:4', label: '3:4' },
        ]);
        html += toggle('vg-audio', 'Audio');
        break;

      case 'veo3':
        html += sel('vg-variant', 'Quality', [
          { value: 'veo3', label: 'Quality ($1.25)', default: true },
          { value: 'veo3_fast', label: 'Fast ($0.30)' },
          { value: 'veo3_lite', label: 'Lite ($0.15)' },
        ]);
        html += sel('vg-aspect', 'Aspect Ratio', [
          { value: '16:9', label: '16:9', default: true },
          { value: '9:16', label: '9:16' },
        ]);
        break;
    }

    html += '</div>';
    wrap.innerHTML = html;
    setTimeout(() => {
      if (typeof Select !== 'undefined') Select.init();
      // Wire up change events for cost estimator
      wrap.querySelectorAll('select').forEach(s => s.addEventListener('change', estimateVgCost));
      wrap.querySelectorAll('.factor-btn').forEach(b => {
        const orig = b.onclick;
        b.onclick = function() { orig?.call(this); setTimeout(estimateVgCost, 10); };
      });
      estimateVgCost();
    }, 30);
  }

  async function submitVideoGen() {
    const btn = document.getElementById('btn-vg');
    if (!uploadedUrl) { toast('Please upload an image first'); return; }

    const body = {
      imageUrl: uploadedUrl,
      videoModel: vgSelectedModel,
    };

    // Creative direction
    const cd = document.getElementById('vg-cd');
    if (cd && cd.value.trim()) body.creativeDirection = cd.value.trim();

    // Model-specific params
    const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
    const isOn = id => { const el = document.getElementById(id); return el ? el.classList.contains('active') : false; };

    switch (vgSelectedModel) {
      case 'grok-imagine':
        body.mode = val('vg-mode') || 'normal';
        body.duration = val('vg-duration') || '10';
        body.resolution = val('vg-resolution') || '720p';
        break;
      case 'kling-2.6':
        body.duration = val('vg-duration') || '10';
        body.sound = isOn('vg-sound');
        break;
      case 'kling-3.0':
        body.mode = val('vg-mode') || 'pro';
        body.duration = val('vg-duration') || '8';
        body.aspectRatio = val('vg-aspect') || '16:9';
        body.sound = isOn('vg-sound');
        break;
      case 'seedance-2':
        body.resolution = val('vg-resolution') || '720p';
        body.duration = val('vg-duration') || '8';
        body.aspectRatio = val('vg-aspect') || '16:9';
        body.generateAudio = isOn('vg-audio');
        break;
      case 'veo3':
        body.variant = val('vg-variant') || 'veo3';
        body.aspectRatio = val('vg-aspect') || '16:9';
        break;
    }

    await runTool(btn, '/api/video', body, 'video');
  }
  window.submitVideoGen = submitVideoGen;


})();
</script>
