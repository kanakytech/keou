name: Feature request
description: Something Keou should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you are trying to get done — not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would good look like?
